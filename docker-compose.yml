services:
  jamsholat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jamsholat
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"

      # Redirect /jamsholat to /jamsholat/ so relative assets resolve correctly
      - 'traefik.http.middlewares.jamsholat-slash.redirectregex.regex=^https?://azure\.susilon\.com/jamsholat$'
      - "traefik.http.middlewares.jamsholat-slash.redirectregex.replacement=https://azure.susilon.com/jamsholat/"
      - "traefik.http.middlewares.jamsholat-slash.redirectregex.permanent=true"

      # HTTP -> HTTPS redirect for the Azure host and /jamsholat path
      - "traefik.http.routers.jamsholat-http.rule=Host(`azure.susilon.com`) && PathPrefix(`/jamsholat`)"
      - "traefik.http.routers.jamsholat-http.entrypoints=web"
      - "traefik.http.routers.jamsholat-http.middlewares=jamsholat-slash@docker,jamsholat-redirect@docker"
      - "traefik.http.middlewares.jamsholat-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.jamsholat-redirect.redirectscheme.permanent=true"

      # HTTP -> HTTPS redirect for the dedicated Jam Sholat host
      - "traefik.http.routers.jamsholat-host-http.rule=Host(`jamsholat.susilon.com`)"
      - "traefik.http.routers.jamsholat-host-http.entrypoints=web"
      - "traefik.http.routers.jamsholat-host-http.middlewares=jamsholat-redirect@docker"

      # HTTPS route for the Azure host and /jamsholat path
      - "traefik.http.routers.jamsholat.rule=Host(`azure.susilon.com`) && PathPrefix(`/jamsholat`)"
      - "traefik.http.routers.jamsholat.entrypoints=websecure"
      - "traefik.http.routers.jamsholat.tls=true"
      - "traefik.http.routers.jamsholat.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jamsholat.middlewares=jamsholat-slash@docker,jamsholat-strip@docker"

      # HTTPS route for the dedicated Jam Sholat host
      - "traefik.http.routers.jamsholat-host.rule=Host(`jamsholat.susilon.com`)"
      - "traefik.http.routers.jamsholat-host.entrypoints=websecure"
      - "traefik.http.routers.jamsholat-host.tls=true"
      - "traefik.http.routers.jamsholat-host.tls.certresolver=letsencrypt"

      # Remove the /jamsholat prefix before sending traffic to the nginx container
      - "traefik.http.middlewares.jamsholat-strip.stripprefix.prefixes=/jamsholat"
      - "traefik.http.services.jamsholat.loadbalancer.server.port=80"

networks:
  frontend:
    external: true
